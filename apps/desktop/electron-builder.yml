# Packaging for the Windows installer (macOS / Linux targets are configured but untested).
appId: app.mohhey.player
productName: Mohhey Player
copyright: Mohhey
directories:
  output: dist
  buildResources: resources

# The main/preload/renderer bundles are fully self-contained; only icons from resources/ are read at runtime.
files:
  - out/**/*
  - resources/icon.png
  - resources/tray.png
  - resources/tray@2x.png
  - package.json

# The compiled API (see scripts/build-api.mjs) lives next to the app, not inside the asar archive.
extraResources:
  - from: build/api
    to: api

asar: true
npmRebuild: false
# Never published automatically: updates are an explicit decision (see docs/agent.md).
publish: null

win:
  target:
    - target: nsis
      arch: [x64]
  icon: resources/icon.ico
  artifactName: Mohhey-Player-Setup-${version}.${ext}

nsis:
  # A step-by-step wizard: welcome > licence > install folder > install > finish. Nothing is pre-decided for the user.
  oneClick: false
  perMachine: false
  # No elevation prompt: the app installs for the current user only, so the installer never needs administrator rights.
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: Mohhey Player
  uninstallDisplayName: Mohhey Player
  runAfterFinish: true
  installerIcon: resources/icon.ico
  uninstallerIcon: resources/icon.ico
  installerHeaderIcon: resources/icon.ico
  installerSidebar: resources/installer/sidebar.bmp
  uninstallerSidebar: resources/installer/sidebar.bmp
  installerHeader: resources/installer/header.bmp
  license: resources/installer/license.txt
  include: resources/installer/installer.nsh
  multiLanguageInstaller: true
  # Persian is added by hand in installer.nsh (electron-builder maps fa to a language file this NSIS version lacks).
  installerLanguages: [en_US]
  # The installer's own data prompt (installer.nsh) asks before touching %APPDATA%Mohhey Player.
  deleteAppDataOnUninstall: false

# Hardened Electron binary: no Node mode, no inspector/NODE_OPTIONS, app only from the integrity-checked asar.
electronFuses:
  runAsNode: false
  enableCookieEncryption: true
  enableNodeOptionsEnvironmentVariable: false
  enableNodeCliInspectArguments: false
  enableEmbeddedAsarIntegrityValidation: true
  onlyLoadAppFromAsar: true
  grantFileProtocolExtraPrivileges: false

mac:
  target: dmg
  icon: resources/icon.png
  category: public.app-category.music
linux:
  target: AppImage
  icon: resources/icon.png
  category: Audio
